name: auto-update
on:
  push:
    paths: ['tools/auto.flag']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: python3 tools/auto-update.py
      - run: |
          set -euo pipefail
          python3 -c "import yaml,sys; yaml.safe_load(open('.github/workflows/image-build.yml')); yaml.safe_load(open('.github/workflows/upstream-sync.yml')); print('yaml ok')"
          bash -n installer/reinstall.sh
          git config user.name 'snapfree-bot'
          git config user.email 'bot@users.noreply.github.com'
          git add -A
          git commit -m 'feat: 每日随机重建 + 每镜像独立 tag + 上游 trans.sh 自动同步' || echo no-change
          git push
