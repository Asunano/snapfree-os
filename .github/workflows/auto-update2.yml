name: auto-update2
on:
  push:
    paths: ['tools/auto2.flag']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: 应用补丁
        run: |
          set -euxo pipefail
          python3 tools/auto-update.py

      - name: 校验 YAML 与语法
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import subprocess, sys
          try:
              import yaml
          except ImportError:
              subprocess.run([sys.executable, '-m', 'pip', 'install', '--quiet', 'pyyaml'], check=True)
              import yaml
          for f in ['.github/workflows/image-build.yml', '.github/workflows/upstream-sync.yml']:
              yaml.safe_load(open(f))
              print('yaml ok', f)
          PY
          bash -n installer/reinstall.sh
          bash -n installer/trans.sh

      - name: 清理脚手架并提交
        run: |
          set -euxo pipefail
          rm -f .github/workflows/auto-update2.yml tools/auto2.flag
          git config user.name 'snapfree-bot'
          git config user.email 'bot@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'feat: 每日随机重建 + 每镜像独立 tag + 上游 trans.sh 自动同步' || echo 'no change'
          git push
