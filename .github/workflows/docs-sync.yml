name: docs-sync
on:
  push:
    paths: ['tools/docs2.flag']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: 应用文档补丁
        run: |
          set -euxo pipefail
          python3 tools/auto-update.py

      - name: 回退工作流改动（workflow 只能由连接器推送）
        run: |
          set -euxo pipefail
          git checkout -- .github/workflows/image-build.yml
          rm -f .github/workflows/upstream-sync.yml
          rm -f .github/workflows/docs-sync.yml tools/docs2.flag
          rm -f .github/workflows/auto-update.yml .github/workflows/auto-update2.yml
          git add -A
          git status --short

      - name: 提交文档与清理
        run: |
          set -euxo pipefail
          git config user.name 'snapfree-bot'
          git config user.email 'bot@users.noreply.github.com'
          git commit -m 'docs: 自动更新说明 + 清理脚手架' || echo 'no change'
          git push
