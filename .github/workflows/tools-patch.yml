name: tools-patch
on:
  push:
    paths: ['tools/patch.flag']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: python3 tools/patch-check.py
      - run: |
          set -euo pipefail
          bash -n tools/snapfree-check.sh
          git config user.name 'snapfree-bot'
          git config user.email 'bot@users.noreply.github.com'
          git add -A
          git commit -m '[tools] snapfree-check 支持 Ubuntu/Debian 双发行版' || echo no-change
          git push
