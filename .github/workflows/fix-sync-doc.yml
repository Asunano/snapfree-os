name: fix-sync-doc
on:
  push:
    paths: ['tools/fsd.flag']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: 修正文档中的语法检查描述
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path('docs/BUILD.md')
          t = p.read_text()
          old = '1. 拉取上游 `trans.sh`、`reinstall.sh`，两者先过 `bash -n`'
          new = '1. 拉取上游 `trans.sh`、`reinstall.sh`：`reinstall.sh` 过 `bash -n`，`trans.sh` 只查体积与锚点（它由 busybox ash 运行，用 bash/sh 做语法检查会误报）'
          if old in t:
              p.write_text(t.replace(old, new, 1))
              print('docs 已修正')
          else:
              print('未命中，跳过')
          PY

      - name: 清理并提交
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-sync-doc.yml tools/fsd.flag
          git config user.name 'snapfree-bot'
          git config user.email 'bot@users.noreply.github.com'
          git add -A
          git commit -m 'docs: 说明 trans.sh 的语法检查差异' || echo 'no change'
          git push
