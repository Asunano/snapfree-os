name: mirror-accel
on:
  push:
    paths: ['tools/mirror.flag']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: python3 tools/add-mirror-accel.py
      - run: |
          set -euo pipefail
          bash -n installer/reinstall.sh
          grep -c 'sf_accel_url' installer/reinstall.sh
          git config user.name 'snapfree-bot'
          git config user.email 'bot@users.noreply.github.com'
          git add -A
          git commit -m '[mirror] 安装器加镜像下载加速（国内直用 / 海外仅 GitHub 不通时启用）' || echo no-change
          git push
