name: speed-pick
on:
  push:
    paths: ['tools/speed.flag']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: python3 tools/speed-pick.py
      - run: |
          set -euo pipefail
          bash -n installer/reinstall.sh
          git config user.name 'snapfree-bot'
          git config user.email 'bot@users.noreply.github.com'
          git add -A
          git commit -m 'feat: 镜像站测速取最快 + README 重写为面向用户' || echo no-change
          git push
