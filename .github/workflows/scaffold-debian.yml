name: scaffold-debian
on:
  push:
    paths: ['tools/scaffold.flag']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scaffold:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[scaffold]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: 修复 debian 套件（keyring / 安全源 / apt-mirror）
        run: python3 tools/debian-fix.py

      - name: 提交
        run: |
          set -euo pipefail
          git status --porcelain
          git config user.name 'snapfree-bot'
          git config user.email 'bot@users.noreply.github.com'
          git add -A
          git commit -m '[scaffold] fix(debian): keyring 包名、security 源、apt-mirror 双 stanza' || echo '没有变更'
          git push
