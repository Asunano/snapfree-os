name: scaffold-debian
on:
  push:
    paths: ['tools/scaffold.flag']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scaffold:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[scaffold]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: 生成 debian 套件并补丁安装器
        run: python3 tools/scaffold.py

      - name: 提交
        run: |
          set -euo pipefail
          git status --porcelain
          git config user.name 'snapfree-bot'
          git config user.email 'bot@users.noreply.github.com'
          git add -A
          git commit -m '[scaffold] distros/debian 生成 + 通用 apt-mirror/keyring + 安装器 debian 分支校验' || echo '没有变更'
          git push
