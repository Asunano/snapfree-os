name: speed-fix
on:
  push:
    paths: ['tools/speedfix.flag']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: python3 tools/fix-speed-parse.py
      - run: |
          set -euo pipefail
          bash -n installer/reinstall.sh
          git config user.name 'snapfree-bot'
          git config user.email 'bot@users.noreply.github.com'
          git add -A
          git commit -m 'fix: 镜像测速结果改用 awk 解析' || echo no-change
          git push
