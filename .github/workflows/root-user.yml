name: root-user
on:
  push:
    paths: ['tools/root.flag']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: python3 tools/root-user.py
      - run: |
          set -euo pipefail
          bash -n installer/reinstall.sh
          for d in distros/ubuntu distros/debian; do
            bash -n $d/conf.sh; bash -n $d/hooks/10-prepare.sh
          done
          git config user.name 'snapfree-bot'
          git config user.email 'bot@users.noreply.github.com'
          git add -A
          git commit -m 'feat: 默认用户 root + nano + 测速串行' || echo no-change
          git push
