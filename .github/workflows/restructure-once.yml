# 一次性结构迁移：把 ubuntu 构建套件移到 distros/ubuntu，并删除旧 build.yml
name: restructure-once

on:
  push:
    paths:
      - 'tools/restructure.flag'

permissions:
  contents: write

jobs:
  move:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: git mv
        run: |
          set -euo pipefail
          mkdir -p distros/ubuntu
          for f in build.sh conf.sh Makefile .gitignore LICENSE packages.list packages-ops.list packages.remove; do
            if [ -f "$f" ]; then git mv "$f" "distros/ubuntu/$f"; fi
          done
          for d in hooks scripts files; do
            if [ -d "$d" ]; then git mv "$d" "distros/ubuntu/$d"; fi
          done
          if [ -f README.md ]; then git mv README.md distros/ubuntu/README.md; fi
          git rm -q .github/workflows/build.yml || true
          ls -R distros/ubuntu | head -40

      - name: 提交并推送
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor: ubuntu 构建套件移入 distros/ubuntu'
          git push
