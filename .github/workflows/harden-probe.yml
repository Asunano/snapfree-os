name: harden-probe
on:
  push:
    paths: ['tools/probe.flag']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: python3 tools/harden-probe.py
      - run: |
          set -euo pipefail
          bash -n installer/reinstall.sh
          git config user.name 'snapfree-bot'
          git config user.email 'bot@users.noreply.github.com'
          git add -A
          git commit -m '[mirror] 探测加固：过滤 text/html 伪 200' || echo no-change
          git push
