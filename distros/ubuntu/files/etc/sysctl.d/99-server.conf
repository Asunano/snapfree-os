# 服务器内核参数：网络性能（BBR/fq）、连接队列、缓冲区、资源上限
# 说明：sysctl 只做运行时参数，模块加载见 /etc/modules-load.d/99-server.conf

# ---- 拥塞控制：BBR + fq 队列（提升高延迟/跨境链路吞吐）----
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# ---- 连接队列与握手 ----
net.core.somaxconn = 4096
net.core.netdev_max_backlog = 16384
net.ipv4.tcp_max_syn_backlog = 8192
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_syncookies = 1

# ---- TIME_WAIT 与端口复用（反向代理/高并发连接友好）----
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_max_tw_buckets = 262144
net.ipv4.ip_local_port_range = 1024 65535

# ---- 高延迟链路优化 ----
# 允许路径 MTU 探测，避免隧道/云网络的 PMTU 黑洞
net.ipv4.tcp_mtu_probing = 1
# 空闲后不重置慢启动，长连接突发更稳
net.ipv4.tcp_slow_start_after_idle = 0
net.ipv4.tcp_notsent_lowat = 131072

# ---- 收发缓冲区上限（16 MiB，适配高 BDP 链路）----
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.ipv4.tcp_rmem = 4096 87380 16777216
net.ipv4.tcp_wmem = 4096 65536 16777216
net.core.optmem_max = 65536

# ---- 转发（Docker / 隧道 / 内网穿透需要）----
net.ipv4.ip_forward = 1
net.ipv6.conf.all.forwarding = 1

# ---- 内存 / 缓存 ----
vm.swappiness = 10
vm.vfs_cache_pressure = 50
vm.dirty_ratio = 20
vm.dirty_background_ratio = 10

# ---- 文件句柄 / inotify（配合 limits.d 的 65536）----
fs.file-max = 2097152
fs.nr_open = 1048576
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 1024
