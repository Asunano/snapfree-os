# 镜像专用 cloud-init 覆盖配置
datasource_list: [ NoCloud, ConfigDrive, None ]
manual_cache_clean: true

# 不要改写我们写死的 apt 源
apt_preserve_sources_list: true

disable_root: false
ssh_pwauth: true
manage_etc_hosts: false
# 安装器会用 systemd-firstboot 把时区写成 Etc/UTC，
# 这里显式声明一次，首启 sf-firstboot 再兜一层
timezone: __TIMEZONE__

system_info:
  default_user:
    name: __USER_NAME__
    lock_passwd: false
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    groups: [sudo]

# 首启不因无数据源长时间等待
vendor_data: { enabled: false }
